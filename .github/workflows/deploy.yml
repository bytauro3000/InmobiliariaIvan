name: Deploy Backend to Render

on:
  push:
    branches:
      - main  # Se activa cada vez que subes cambios a la rama main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar archivo JAR (Maven)
        run: mvn clean package -DskipTests

      - name: Login en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Construir y subir imagen a Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # Reemplaza 'tu-usuario' por tu nombre real de Docker Hub o usa un secreto
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/inmobiliaria-backend:latest 

      - name: Notificar a Render para actualizar
        run: |
          curl -f ${{ secrets.RENDER_DEPLOY_HOOK }}
