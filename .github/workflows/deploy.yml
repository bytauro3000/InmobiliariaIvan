name: Deploy Backend to Hetzner + Render

on:
  push:
    branches:
      - main

# Concurrency: si se hacen varios pushes seguidos, cancela el job anterior
# y solo corre el último (evita colas "Waiting for runner" y deploys duplicados).
concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar archivo JAR (Maven)
        run: mvn clean package -DskipTests

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Construir y subir imagen a Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # ✅ Se usan las variables de tus secretos para formar la ruta completa
          tags: "${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO }}:latest"

      # ── DESPLIEGUE EN HETZNER (monolito Ivan) ──
      # Requiere secrets: HETZNER_HOST, HETZNER_USER, HETZNER_SSH_KEY, HETZNER_DEPLOY_DIR.
      # Mientras no estén configurados, el paso se OMITE (no falla) y Render Ivan
      # queda intacto. Solo se activa el deploy a Hetzner cuando los secrets existan.
      - name: Desplegar en Hetzner (SSH)
        if: ${{ secrets.HETZNER_HOST != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          # Huella ED25519 del servidor (permite al runner verificar sin preguntar)
          fingerprint: SHA256:d+/OEtS2FljIMvznugzqMo5ZOOnYBBe2u1pamB8XRso
          script: |
            cd ${{ secrets.HETZNER_DEPLOY_DIR }}
            docker compose pull inmobiliariaivan
            docker compose up -d inmobiliariaivan
            docker image prune -f

      # ── NOTIFICAR A RENDER (Merruic) ──
      # Ivan ya no se despliega en Render (migrado a Hetzner).
      # Se ejecuta SIEMPRE, incluso si el paso de Hetzner se omitió.
      - name: Notificar a Render (Merruic)
        run: curl -f "${{ secrets.RENDER_DEPLOY_HOOK_MERRUIC }}"