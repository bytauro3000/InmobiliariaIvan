name: Deploy Backend to Render

on:
  push:
    branches:
      - main

# Concurrency: si se hacen varios pushes seguidos, cancela el job anterior
# y solo corre el último (evita colas "Waiting for runner" y deploys duplicados).
concurrency:
  group: deploy-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar archivo JAR (Maven)
        run: mvn clean package -DskipTests

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Construir y subir imagen a Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # ✅ Se usan las variables de tus secretos para formar la ruta completa
          tags: "${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO }}:latest"

      - name: Notificar a Render (Ivan)
        run: curl -f "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Notificar a Render (Merruic)
        run: curl -f "${{ secrets.RENDER_DEPLOY_HOOK_MERRUIC }}"
