# ===============================
# APLICACION
# ===============================
spring.application.name=InmobiliariaIvan
server.port=${PORT}

# ===============================
# DATASOURCE (usar variables de entorno)
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CONNECTION POOL (HikariCP)
# Evita que Render cierre conexiones inactivas
# ===============================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=60000

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# NO mostrar SQL en produccion
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


# ===============================
# HIBERNATE BATCH - OPTIMIZACION BD REMOTA
# ===============================
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===============================
# LOGGING
# ===============================
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF

# ===============================
# TOMCAT
# ===============================
server.tomcat.max-swallow-size=2MB

# ===============================
# JWT
# ===============================
jwt.secret-key=${JWT_SECRET}

# ===============================
# SEGURIDAD INTERNA GATEWAY
# ===============================
gateway.secret-key=${GATEWAY_SECRET}

# ===============================
# SEGURIDAD MVC
# ===============================
spring.mvc.pathmatch.matching-strategy=ant-path-matcher
spring.thymeleaf.check-template-location=false
spring.jackson.serialization.fail-on-empty-beans=false

# ===============================
# CLOUDINARY - no tocar nada
# ===============================
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# ===============================
# ESPACIO ARCHIVOS - no tocar nada
# ===============================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ===============================
# EMAIL
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===================================
# TIPO DE CAMBIO - ExchangeRate API
# ===================================
exchangerate.api-key=${EXCHANGERATE_API_KEY}

# ===============================
# CACHE Caffeine
# Reemplaza ConcurrentMapCache que nunca expiraba
# maximumSize=500  -> maximo 500 entradas por cache
# expireAfterWrite=10m -> expira 10 min despues de escribirse
# ===============================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

# ===============================
# MICROSERVICIO SERVICIOS BASICOS
# Agregar en Render: MS_SERVICIOS_BASICOS_URL = URL de tu microservicio
# ===============================
microservice.servicios-basicos.url=${MS_SERVICIOS_BASICOS_URL}

# ===============================
# INTEGRACION SUNAT - APIPERU
# Base URL de APIPERU (producción)
# ===============================
apisperu.base-url=https://facturacion.apisperu.com/api/v1
# Token de empresa APIPERU (se obtiene al registrar empresa en su portal)
# Tu empresa código 6278 - RUC 20537853108 - ambiente beta
apisperu.company-token=${APISPERU_COMPANY_TOKEN}
# RUC de la empresa emisora
apisperu.ruc=20537853108
# Ambiente: beta o produccion
apisperu.environment=produccion

# ===============================
# DECOLECTA - API RENIEC
# ===============================
decolecta.api.token=${DECOLECTA_TOKEN}
decolecta.api.url=${DECOLECTA_URL}

# ===============================
# WHATSAPP - APISPERU MENSAJES
# ===============================
whatsapp.base-url=https://whatsapp.apisperu.com/api/v1
whatsapp.username=${WHATSAPP_USERNAME}
whatsapp.password=${WHATSAPP_PASSWORD}
whatsapp.device-id=InmobiliariaIVAN

# ===============================
# PIN DE AUTORIZACIÓN PARA PAGOS
# ===============================
app.pago.pin=${PAGO_PIN}